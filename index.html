<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css" integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS" crossorigin="anonymous">

    <title>Words, Beautiful Words!</title>
    <style>
      .word { cursor: pointer; }
      .word:hover { text-decoration: underline; }
      .word.included { font-weight: bold; color: #28a745; }
      #word-menu { position: absolute; z-index: 1000; display: none; }
    </style>
  </head>
  <body>
    <div class="btn-group btn-group-toggle" data-toggle="buttons">
      <label class="btn btn-secondary active">
        <input type="radio" name="querytype" value="fill-in-blanks"
        autocomplete="off" checked> Fill In Blanks
      </label>
      <label class="btn btn-secondary">
        <input type="radio" name="querytype" value="anagram" autocomplete="off"> Anagram
      </label>
      <label class="btn btn-secondary">
        <input type="radio" name="querytype" value="pangram" autocomplete="off"> Pangram
      </label>
      <label class="btn btn-secondary">
        <input type="radio" name="querytype" value="regex" autocomplete="off"> Regex
      </label>
    </div>
    <p>
    <form action="#">
      <div class="form-group">
        <input type="text" id="query" autofocus>
        <button  class="btn btn-primary btn-sm" id="go">Go</button>
        <button  class="btn btn-primary btn-sm" id="clear">X</button>
      </div>
      <div class="form-group form-inline" id="anagram-options" style="display: none">
        <label for="word-count" class="mr-1">Words</label>
        <select id="word-count" class="form-control form-control-sm mr-3">
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option>
        </select>
        <span id="lengths-group" style="display: none">
          <span class="mr-1">Lengths</span>
          <span id="lengths"></span>
        </span>
      </div>
    </form>
    <input type="search" id="result-filter" class="form-control form-control-sm mb-1" placeholder="Filter results, e.g. room" autocomplete="off" style="display: none; max-width: 20em">
    <div id="word-filters" class="mb-1" style="display: none"></div>
    <div id="result-count" class="text-muted"></div>
    <div class="list-group" id="results">
    </div>
    </p>
    <div id="word-menu" class="btn-group btn-group-sm shadow bg-white" role="menu">
      <button type="button" class="btn btn-outline-success" data-action="include" title="Definitely in the answer">&#x1F44D;</button>
      <button type="button" class="btn btn-outline-danger" data-action="exclude" title="Not in the answer">&#x1F44E;</button>
      <button type="button" class="btn btn-outline-secondary" data-action="look" title="Look up this word">&#x1F441;</button>
    </div>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"
  integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8="
  crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js" integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js" integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k" crossorigin="anonymous"></script>
    <script src="js/jquery.preloaders.min.js"></script>
    <script src="js/dict.js?v1.5"></script>
  </body>
</html>
